[package]
name = "one-pass"
version = "0.1.0"
description = "Desktop password manager that hands secrets to `op run` after approval"
authors = ["Thanik Cheowtirakul"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "one_pass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
zeroize = { version = "1.9.1", features = ["serde"] }
onepass-core = { version = "0.1.0", path = "../onepass-core" }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-clipboard-manager = "2.5.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

