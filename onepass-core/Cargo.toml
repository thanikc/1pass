[package]
name = "onepass-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["vault"]
# Crypto and vault storage. The CLI builds with default-features = false so it can never decrypt.
vault = ["dep:argon2", "dep:chacha20poly1305", "dep:zeroize"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = { version = "0.5", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
zeroize = { version = "1", features = ["serde"], optional = true }

[dev-dependencies]
proptest = "1.12.0"
