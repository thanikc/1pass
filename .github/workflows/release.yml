# Builds versioned installers (with the `op` sidecar) for every pushed tag `vX.Y.Z`
# and attaches them to a draft GitHub Release named after the tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Tauri needs a semver version for the bundle metadata and file names.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z semver"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; assets will be replaced."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "one-pass $TAG" --generate-notes
          fi

  bundle:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc floor low so the AppImage/deb run on older distros.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Bundle ${{ matrix.target }} as ${{ env.VERSION }}
        # Second --config merges over tauri.bundle.conf.json, stamping the tag's version
        # into the app metadata and installer file names without editing the repo.
        run: npm run bundle -- --target "${{ matrix.target }}" --config "{\"version\":\"$VERSION\"}"

      - name: Collect installers and checksums
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          shopt -s nullglob
          for f in "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage "$bundle"/dmg/*.dmg; do
            cp "$f" out/
          done
          cd out
          files=(*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found in $bundle"
            exit 1
          fi
          shasum -a 256 "${files[@]}" > "SHA256SUMS-${{ matrix.target }}.txt"
          ls -l

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
