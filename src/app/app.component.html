@if (ipcError(); as err) {
  <p class="banner" role="alert">
    <code>op</code> cannot connect to this app: {{ err }}
  </p>
}
@switch (status()) {
  @case ("missing") {
    <app-unlock status="missing" (unlocked)="refresh()" />
  }
  @case ("locked") {
    <app-unlock status="locked" (unlocked)="refresh()" />
  }
  @case ("unlocked") {
    <main class="shell">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" [attr.aria-selected]="tab() === 'vault'" (click)="tab.set('vault')">Vault</button>
        <button type="button" role="tab" [attr.aria-selected]="tab() === 'approvals'" (click)="tab.set('approvals')">Approvals</button>
        <button type="button" role="tab" [attr.aria-selected]="tab() === 'audit'" (click)="tab.set('audit')">Audit</button>
        <button type="button" role="tab" [attr.aria-selected]="tab() === 'settings'" (click)="tab.set('settings')">Settings</button>
        <button type="button" class="lock" data-testid="lock" (click)="lock()">Lock</button>
      </div>
      @switch (tab()) {
        @case ("vault") { <app-browser /> }
        @case ("approvals") { <app-grants /> }
        @case ("audit") { <app-audit /> }
        @case ("settings") { <app-settings /> }
      }
    </main>
  }
}

<app-approval-dialog />
